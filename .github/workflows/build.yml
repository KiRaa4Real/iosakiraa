name: Build iOS dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Compile to iOS dylib with UIKit
      run: |
        xcrun --sdk iphoneos clang++ -shared -fPIC -arch arm64 main.mm -o roskira.dylib -framework UIKit -framework Foundation -isysroot $(xcrun --sdk iphoneos --show-sdk-path)
        
    - name: Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: roskira-dylib
        path: roskira.dylib
