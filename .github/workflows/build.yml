name: Build iOS dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Compile to dylib
              
      run: |
        clang++ -shared -fPIC -arch arm64 main.cpp -o roskira.dylib
        
    - name: Upload dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: roskira-dylib
        path: roskira.dylib
